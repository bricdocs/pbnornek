<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBO Handviewer Test</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

button {
    padding: 7px 12px;
    cursor: pointer;
}

/* MODAL */

.modal-overlay {
    display: none;

    position: fixed;
    z-index: 1000;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.65);
}

.modal {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 950px;
    max-width: 95%;

    height: 750px;
    max-height: 90%;

    background: white;

    border-radius: 8px;

    box-shadow: 0 5px 30px rgba(0,0,0,0.5);

    overflow: hidden;
}

/* MODAL BAŞLIK */

.modal-header {
    height: 45px;

    background: #333;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    box-sizing: border-box;
}

.modal-title {
    font-size: 18px;
    font-weight: bold;
}

.close-button {
    background: #c00;
    color: white;

    border: none;

    font-size: 20px;

    width: 35px;
    height: 30px;

    cursor: pointer;
}

/* BBO */

.bbo-container {
    width: 100%;
    height: calc(100% - 45px);
}

#bboViewer {
    width: 100%;
    height: 100%;

    border: none;
}

/* CEP */

@media (max-width: 600px) {

    body {
        margin: 10px;
    }

    .modal {
        width: 100%;
        max-width: 100%;

        height: 100%;
        max-height: 100%;

        top: 0;
        left: 0;

        transform: none;

        border-radius: 0;
    }

}

</style>
</head>

<body>

<button onclick="showBBO()">Bord Detay</button>

<div id="bboModal" class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                Bord 2
            </div>

            <button
                class="close-button"
                onclick="closeBBO()">
                X
            </button>

        </div>

        <div class="bbo-container">

            <iframe
                id="bboViewer"
                src=""
                allowfullscreen>
            </iframe>

        </div>

    </div>

</div>

<script>

function showBBO() {

    const bboURL =
//"https://www.bridgebase.com/tools/handviewer.html?v3b=web&v3v=6.61.5&lin=pn%7C%2C%2C%2C%7Cst%7C%7Cmd%7C1SQ9752HKDKT732CAQ%2CS84HJ9842DQ85C873%2CSK63HAT653D94CK96%2CSAJTHQ7DAJ6CJT542%7Csv%7Cs%7Crh%7C%7Cah%7CBoard+2%7Cmb%7CP%7Cmb%7CP%7Cmb%7C2S%7Cmb%7CP%7Cmb%7CP%7Cmb%7Cpc%7CS4%7Cpc%7CSQ%7Cpc%7CS2%7Cpc%7CS3%7C";
"https://www.bridgebase.com/tools/handviewer.html?v3b=web&v3v=6.61.5&tbt=n&lin=pn%7C%2C%2C%2C%7Cst%7C%7Cmd%7C1SQ9752HKDKT732CAQ%2CS84HJ9842DQ85C873%2CSK63HAT653D94CK96%2CSAJTHQ7DAJ6CJT542%7Crh%7C%7Cah%7CBoard%202%7Csv%7Cn%7Cmb%7C2S%7Cmb%7Cp%7Cmb%7Cp%7Cmb%7Cp%7Cpc%7CS4%7Cpc%7CS3%7Cpc%7CSA%7Cpc%7CS2%7C";
    document.getElementById("bboViewer").src = bboURL;

    document.getElementById("bboModal").style.display = "block";
}

function closeBBO() {

    document.getElementById("bboModal").style.display = "none";

    document.getElementById("bboViewer").src = "";
}

</script>

</body>
</html>
