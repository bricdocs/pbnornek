<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briç El Diyagramı</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .bridge-table { background: #1e5631; color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 320px; position: relative; font-weight: bold; }
        .info { text-align: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; font-size: 14px; }
        .hand { width: 90px; }
        .north { margin: 0 auto; text-align: left; }
        .middle-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .west { text-align: left; }
        .compass { background: #113f21; border: 2px solid white; border-radius: 5px; width: 50px; height: 50px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 12px; }
        .east { text-align: left; }
        .south { margin: 0 auto; text-align: left; }
        .suit { display: flex; align-items: center; margin: 2px 0; font-size: 15px; }
        .spade { color: #000; background: white; border-radius: 3px; padding: 0 4px; margin-right: 5px; }
        .heart { color: #d12229; background: white; border-radius: 3px; padding: 0 4px; margin-right: 5px; }
        .diamond { color: #f2a900; background: white; border-radius: 3px; padding: 0 4px; margin-right: 5px; }
        .club { color: #007a87; background: white; border-radius: 3px; padding: 0 4px; margin-right: 5px; }
    </style>
</head>
<body>

<div class="bridge-table">
    <div class="info">Bord 1 | Dağıtan: N | Zafiyet: Yok<br>Kontrat: 1NT (N) | Sonuç: 7</div>
    
    <!-- KUZEY -->
    <div class="hand north">
        <div class="suit"><span class="spade">♠</span> A T 8 5</div>
        <div class="suit"><span class="heart">♥</span> K 4</div>
        <div class="suit"><span class="diamond">♦</span> 6 3 2</div>
        <div class="suit"><span class="club">♣</span> A 8 5 4</div>
    </div>

    <!-- BATI / PUSULA / DOĞU -->
    <div class="middle-row">
        <div class="hand west">
            <div class="suit"><span class="spade">♠</span> K 9 6</div>
            <div class="suit"><span class="heart">♥</span> 9 7</div>
            <div class="suit"><span class="diamond">♦</span> A Q 7 5</div>
            <div class="suit"><span class="club">♣</span> 9 7 6</div>
        </div>
        
        <div class="compass">
            <div>N</div>
            <div style="display:flex; gap:15px;"><span>W</span><span>E</span></div>
            <div>S</div>
        </div>
        
        <div class="hand east">
            <div class="suit"><span class="spade">♠</span> Q 7 3</div>
            <div class="suit"><span class="heart">♥</span> A J 3</div>
            <div class="suit"><span class="diamond">♦</span> T 9 8 4</div>
            <div class="suit"><span class="club">♣</span> K Q 3</div>
        </div>
    </div>

    <!-- GÜNEY -->
    <div class="hand south">
        <div class="suit"><span class="spade">♠</span> J 4 2</div>
        <div class="suit"><span class="heart">♥</span> Q T 8 5 2</div>
        <div class="suit"><span class="diamond">♦</span> K J</div>
        <div class="suit"><span class="club">♣</span> J T 2</div>
    </div>
</div>

</body>
</html>
