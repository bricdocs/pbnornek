<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBN Briç El Galerisi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #eceff1; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #2c3e50; margin-bottom: 20px; text-align: center; }
        
        /* Buton Grubu Stilleri */
        .tab-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 25px; max-width: 500px; }
        .tab-btn { background-color: #ffffff; border: 2px solid #1e5631; color: #1e5631; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.2s ease; }
        .tab-btn:hover { background-color: #e8f5e9; }
        .tab-btn.active { background-color: #1e5631; color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.16); }
        
        /* Navigasyon Okları Stilleri */
        .nav-container { display: flex; justify-content: space-between; width: 320px; margin-top: 15px; gap: 10px; }
        .nav-btn { background-color: #2c3e50; border: none; color: white; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; transition: background 0.2s; text-align: center; }
        .nav-btn:hover { background-color: #34495e; }
        .nav-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; opacity: 0.5; }

        /* Briç Masası Stilleri */
        .board-content { display: none; }
        .board-content.active { display: block; animation: fadeIn 0.3s ease; }
        .bridge-table { background: #1e5631; color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); width: 320px; font-weight: bold; margin: 0 auto; box-sizing: border-box; }
        .info { text-align: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; font-size: 14px; }
        .hand { width: 90px; }
        .north { margin: 0 auto; text-align: left; }
        .middle-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .west { text-align: left; }
        .compass { background: #113f21; border: 2px solid white; border-radius: 5px; width: 50px; height: 50px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 12px; }
        .east { text-align: left; }
        .south { margin: 0 auto; text-align: left; }
        .suit { display: flex; align-items: center; margin: 2px 0; font-size: 15px; }
        .spade { color: #000; background: white; border-radius: 3px; padding: 0 4px; margin-right: 5px; }
        .heart { color: #d12229; background: white; border-radius: 3px; padding: 0 4px; margin-right: 5px; }
        .diamond { color: #f2a900; background: white; border-radius: 3px; padding: 0 4px; margin-right: 5px; }
        .club { color: #007a87; background: white; border-radius: 3px; padding: 0 4px; margin-right: 5px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <h1>Turnuva Sonuçları (Canlı Galeri)</h1>
    
    <!-- Butonların dinamik yükleneceği alan -->
    <div id="tabs" class="tab-container"></div>
    
    <!-- Ellerin dinamik yükleneceği alan -->
    <div id="gallery-container">PBN Dosyası Yükleniyor...</div>

    <!-- Alt Navigasyon Okları -->
    <div class="nav-container">
        <button id="prev-btn" class="nav-btn" onclick="navigateBoard(-1)">← Önceki Bord</button>
        <button id="next-btn" class="nav-btn" onclick="navigateBoard(1)">Sonraki Bord →</button>
    </div>

<script>
let boardIds = []; // Yüklenen bordların ID listesi
let currentIndex = 0; // Aktif olan bordun indeksi

function parseCards(suitString) {
    return suitString ? suitString.split('').join(' ') : '—';
}

function parseDeal(dealLine) {
    const cleanDeal = dealLine.replace("N:", "");
    const directions = cleanDeal.split(" ");
    const parsePlayer = (str) => {
        const suits = str.split(".");
        return { S: parseCards(suits), H: parseCards(suits), D: parseCards(suits), C: parseCards(suits) };
    };
    return { N: parsePlayer(directions), E: parsePlayer(directions), S: parsePlayer(directions), W: parsePlayer(directions) };
}

// Seçilen el indeksine göre arayüzü güncelleyen fonksiyon
function updateGallery() {
    const activeBoardId = boardIds[currentIndex];

    // Üst butonların aktifliğini güncelle
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${activeBoardId}`).classList.add('active');

    // Masaların görünürlüğünü güncelle
    document.querySelectorAll('.board-content').forEach(content => content.classList.remove('active'));
    document.getElementById(`board-${activeBoardId}`).classList.add('active');

    // Alt okların aktiflik/pasiflik durumunu kontrol et
    document.getElementById('prev-btn').disabled = (currentIndex === 0);
    document.getElementById('next-btn').disabled = (currentIndex === boardIds.length - 1);
}

// Üstteki yuvarlak butonlara tıklandığında çalışan fonksiyon
function switchBoard(boardNo) {
    currentIndex = boardIds.indexOf(boardNo);
    updateGallery();
}

// Alt ok butonlarına basıldığında çalışan fonksiyon (-1 veya +1 alır)
function navigateBoard(direction) {
    let newIndex = currentIndex + direction;
    if (newIndex >= 0 && newIndex < boardIds.length) {
        currentIndex = newIndex;
        updateGallery();
    }
}

fetch('eller.pbn')
    .then(response => response.text())
    .then(text => {
        const rawBoards = text.split(/\n\s*\n/);
        let buttonsHtml = "";
        let galleryHtml = "";
        let isFirst = true;

        rawBoards.forEach(boardText => {
            if(!boardText.trim()) return;

            const boardNo = boardText.match(/\[Board "([^"]+)"\]/)?. || "?";
            const dealer = boardText.match(/\[Dealer "([^"]+)"\]/)?. || "?";
            const vul = boardText.match(/\[Vulnerable "([^"]+)"\]/)?. || "None";
            const dealLine = boardText.match(/\[Deal "([^"]+)"\]/)?.;
            const contract = boardText.match(/\[Contract "([^"]+)"\]/)?. || "Pas";
            const result = boardText.match(/\[Result "([^"]+)"\]/)?. || "";

            if (!dealLine) return;

            // Listeye bord ID'sini ekle
            boardIds.push(boardNo);

            const cards = parseDeal(dealLine);
            const activeClass = isFirst ? "active" : "";

            // Üst Buton Şablonu
            buttonsHtml += `<button id="btn-${boardNo}" class="tab-btn ${activeClass}" onclick="switchBoard('${boardNo}')">Bord ${boardNo}</button>`;

            // Masa İçerik Şablonu
            galleryHtml += `
            <div id="board-${boardNo}" class="board-content ${activeClass}">
                <div class="bridge-table">
                    <div class="info">Bord ${boardNo} | Dağıtan: ${dealer} | Zafiyet: ${vul}<br>Kontrat: ${contract} | Sonuç: ${result}</div>
                    
                    <div class="hand north">
                        <div class="suit"><span class="spade">♠</span> ${cards.N.S}</div>
                        <div class="suit"><span class="heart">♥</span> ${cards.N.H}</div>
                        <div class="suit"><span class="diamond">♦</span> ${cards.N.D}</div>
                        <div class="suit"><span class="club">♣</span> ${cards.N.C}</div>
                    </div>

                    <div class="middle-row">
                        <div class="hand west">
                            <div class="suit"><span class="spade">♠</span> ${cards.W.S}</div>
                            <div class="suit"><span class="heart">♥</span> ${cards.W.H}</div>
                            <div class="suit"><span class="diamond">♦</span> ${cards.W.D}</div>
                            <div class="suit"><span class="club">♣</span> ${cards.W.C}</div>
                        </div>
                        
                        <div class="compass">
                            <div>N</div>
                            <div style="display:flex; gap:15px;"><span>W</span><span>E</span></div>
                            <div>S</div>
                        </div>
                        
                        <div class="hand east">
                            <div class="suit"><span class="spade">♠</span> ${cards.E.S}</div>
                            <div class="suit"><span class="heart">♥</span> ${cards.E.H}</div>
                            <div class="suit"><span class="diamond">♦</span> ${cards.E.D}</div>
                            <div class="suit"><span class="club">♣</span> ${cards.E.C}</div>
                        </div>
                    </div>

                    <div class="hand south">
                        <div class="suit"><span class="spade">♠</span> ${cards.S.S}</div>
                        <div class="suit"><span class="heart">♥</span> ${cards.S.H}</div>
                        <div class="suit"><span class="diamond">♦</span> ${cards.S.D}</div>
                        <div class="suit"><span class="club">♣</span> ${cards.S.C}</div>
                    </div>
                </div>
            </div>`;
            
            isFirst = false;
        });

        document.getElementById('tabs').innerHTML = buttonsHtml;
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        
        // İlk yüklemede butonların durumunu ayarla
        updateGallery();
    })
    .catch(err => {
        document.getElementById('gallery-container').innerHTML = "PBN dosyası yüklenirken hata oluştu.";
        console.error(err);
    });
</script>

</body>
</html>
