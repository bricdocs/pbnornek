<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBO Handviewer Test</title>
</head>

<body>

<button onclick="showBBO()">Bord Detay</button>

<div id="bboModal" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
    z-index:1000;
">

    <div style="
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        width:950px;
        height:750px;
        background:white;
    ">

        <button onclick="closeBBO()" style="
            position:absolute;
            top:5px;
            right:5px;
            z-index:1001;
        ">
            X
        </button>

        <iframe
            id="bboViewer"
            src=""
            style="
                width:100%;
                height:100%;
                border:none;
            ">
        </iframe>

    </div>

</div>

<script>

function showBBO() {

    const bboURL =
    "https://www.bridgebase.com/tools/handviewer.html?v3b=web&v3v=6.61.5&lin=pn%7C%2C%2C%2C%7Cst%7C%7Cmd%7C1SQ9752HKDKT732CAQ%2CS84HJ9842DQ85C873%2CSK63HAT653D94CK96%2CSAJTHQ7DAJ6CJT542%7Csv%7Cn%7Crh%7C%7Cah%7CBoard+2%7Cmb%7C1S%7Cmb%7CP%7Cmb%7C2S%7Cmb%7CP%7Cmb%7CP%7Cmb%7CP%7Cpc%7CS4%7C";

    document.getElementById("bboViewer").src = bboURL;

    document.getElementById("bboModal").style.display = "block";
}

function closeBBO() {

    document.getElementById("bboModal").style.display = "none";

    document.getElementById("bboViewer").src = "";
}

</script>

</body>
</html>
