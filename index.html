<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBN Briç El Galerisi & BBO Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Turnuva Sonuçları (BBO Entegrasyonlu)</h1>
    <div id="tabs" class="tab-container"></div>
    <div id="gallery-container">PBN Dosyası Yükleniyor...</div>

    <div class="nav-container">
        <button id="prev-btn" class="nav-btn" onclick="navigateBoard(-1)">← Önceki Bord</button>
        <button id="next-btn" class="nav-btn" onclick="navigateBoard(1)">Sonraki Bord →</button>
    </div>

<script>
let totalBoards = 0, currentIndex = 0;

function parseCards(suit) { return suit ? suit.split('').join(' ') : '—'; }

function parseDeal(dealLine) {
    const p = dealLine.replace("N:", "").replace(/[cxy]/gi, "").replace(/T/g, "t").split(" ");
    const getHand = (s) => { const k = s.split("."); return { S: parseCards(k[0]), H: parseCards(k[1]), D: parseCards(k[2]), C: parseCards(k[3]) }; };
    return { N: getHand(p[0]), E: getHand(p[1]), S: getHand(p[2]), W: getHand(p[3]) };
}

function generateBboUrl(dealLine, boardNo, contract, vul) {
    const clean = dealLine.replace("N:", "").replace(/[cxy]/gi, "").replace(/T/g, "t").split(" ");
    if(clean.length < 4) return "#";
    const vMap = { "NONE": "-", "ALL": "b", "BOTH": "b", "NS": "n", "EW": "e" };
    const bboVul = vul ? (vMap[vul.toUpperCase().trim()] || "-") : "-";
    const linData = "md|1" + clean[2] + "," + clean[3] + "," + clean[0] + "," + clean[1] + "|ah|Board " + (boardNo || 1) + "|sv|" + bboVul + "|mb|" + contract.trim().toUpperCase().replace(/NT/g, "N") + "|mb|p|mb|p|mb|p|";
    return "https://bridgebase.com" + encodeURIComponent(linData);
}

function updateGallery() {
    document.querySelectorAll('.tab-btn, .board-content').forEach(el => el.classList.remove('active'));
    
    const activeBtn = document.getElementById("btn-idx-" + currentIndex);
    const activeBoard = document.getElementById("board-idx-" + currentIndex);
    
    if (activeBtn) activeBtn.classList.add('active');
    if (activeBoard) activeBoard.classList.add('active');
    
    document.getElementById('prev-btn').disabled = (currentIndex === 0);
    document.getElementById('next-btn').disabled = (currentIndex === totalBoards - 1);
}

function switchBoard(index) { currentIndex = index; updateGallery(); }
function navigateBoard(d) { if (currentIndex + d >= 0 && currentIndex + d < totalBoards) { currentIndex += d; updateGallery(); } }

fetch('eller.pbn?v=' + Math.random())
    .then(r => r.text())
    .then(text => {
        const normalizedText = text.replace(/\r\n/g, "\n");
        const rawBoards = normalizedText.split(/\n\s*\n/);
        let buttonsHtml = "", galleryHtml = "", localCounter = 0;

        rawBoards.forEach(boardText => {
            if(!boardText.includes("[Deal")) return;

            const tag = (t) => { const m = boardText.match(new RegExp('\\[' + t + ' "([^"]+)"\\]')); return m ? m[1] : ""; };
            const boardNo = tag("Board") || "?", dealer = tag("Dealer") || "?", vul = tag("Vulnerable") || "None";
            const dealLine = tag("Deal"), contract = tag("Contract") || "Pas", result = tag("Result") || "";

            if (!dealLine) return;
            const cards = parseDeal(dealLine);
            const activeClass = (localCounter === 0) ? "active" : "";
            const bboUrl = generateBboUrl(dealLine, boardNo, contract, vul);

            buttonsHtml += '<button id="btn-idx-' + localCounter + '" class="tab-btn ' + activeClass + '" onclick="switchBoard(' + localCounter + ')">Bord ' + boardNo + '</button>';
            
            galleryHtml += '<div id="board-idx-' + localCounter + '" class="board-content ' + activeClass + '">' +
                '<div class="bridge-table">' +
                    '<div class="info">Bord ' + boardNo + ' | Dağıtan: ' + dealer + ' | Zafiyet: ' + vul + '<br>Kontrat: ' + contract + ' | Sonuç: ' + result + '</div>' +
                    '<div class="hand north">' +
                        '<div class="suit"><span class="spade">♠</span> ' + cards.N.S + '</div><div class="suit"><span class="heart">♥</span> ' + cards.N.H + '</div>' +
                        '<div class="suit"><span class="diamond">♦</span> ' + cards.N.D + '</div><div class="suit"><span class="club">♣</span> ' + cards.N.C + '</div>' +
                    '</div>' +
                    '<div class="middle-row">' +
                        '<div class="hand west">' +
                            '<div class="suit"><span class="spade">♠</span> ' + cards.W.S + '</div><div class="suit"><span class="heart">♥</span> ' + cards.W.H + '</div>' +
                            '<div class="suit"><span class="diamond">♦</span> ' + cards.W.D + '</div><div class="suit"><span class="club">♣</span> ' + cards.W.C + '</div>' +
                        '</div>' +
                        '<div class="compass"><div>N</div><div style="display:flex; gap:15px;"><span>W</span><span>E</span></div><div>S</div></div>' +
                        '<div class="hand east">' +
                            '<div class="suit"><span class="spade">♠</span> ' + cards.E.S + '</div><div class="suit"><span class="heart">♥</span> ' + cards.E.H + '</div>' +
                            '<div class="suit"><span class="diamond">♦</span> ' + cards.E.D + '</div><div class="suit"><span class="club">♣</span> ' + cards.E.C + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="hand south">' +
                        '<div class="suit"><span class="spade">♠</span> ' + cards.S.S + '</div><div class="suit"><span class="heart">♥</span> ' + cards.S.H + '</div>' +
                        '<div class="suit"><span class="diamond">♦</span> ' + cards.S.D + '</div><div class="suit"><span class="club">♣</span> ' + cards.S.C + '</div>' +
                    '</div>' +
                '</div>' +
                '<a href="' + bboUrl + '" target="_blank" class="bbo-btn">BBO\'da İnteraktif Oyna</a>' +
            '</div>';
            
            localCounter++;
        });

        totalBoards = localCounter;
        document.getElementById('tabs').innerHTML = buttonsHtml;
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        updateGallery();
    })
    .catch(err => { document.getElementById('gallery-container').innerHTML = "PBN dosyası yüklenirken hata oluştu."; });
</script>
</body>
</html>
