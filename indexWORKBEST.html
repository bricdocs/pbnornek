<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Bord Sonuçları</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

/* ANA TABLO */

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th {
    background: #eee;
}

button {
    padding: 7px 12px;
    cursor: pointer;
}


/* MODALIN ARKA PLANI */

.modal-overlay {
    display: none;

    position: fixed;
    z-index: 1000;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.65);
}


/* FORM / MODAL */

.modal {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 950px;
    max-width: 95%;

    height: 750px;
    max-height: 90%;

    background: white;

    border-radius: 8px;

    box-shadow: 0 5px 30px rgba(0,0,0,0.5);

    overflow: hidden;
}


/* MODAL BAŞLIK */

.modal-header {
    height: 45px;

    background: #333;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    box-sizing: border-box;
}

.modal-title {
    font-size: 18px;
    font-weight: bold;
}

.close-button {
    background: #c00;
    color: white;

    border: none;

    font-size: 20px;

    width: 35px;
    height: 30px;

    cursor: pointer;
}


/* BBO */

.bbo-container {
    width: 100%;
    height: calc(100% - 45px);
}

#bboViewer {
    width: 100%;
    height: 100%;

    border: none;
}

</style>
</head>


<body>

<h2>Bord Sonuçları</h2>


<!-- ANA TABLO -->

<table>

<thead>
<tr>
    <th>Bord</th>
    <th>Kontrat</th>
    <th>Sonuç</th>
    <th>İşlem</th>
</tr>
</thead>

<tbody>

<tr>
    <td>1</td>
    <td>4♠</td>
    <td>+420</td>

    <td>
        <button onclick="showBBO()">
            Bord Detay
        </button>
    </td>
</tr>

<tr>
    <td>2</td>
    <td>3NT</td>
    <td>+100</td>

    <td>
        <button onclick="showBBO()">
            Bord Detay
        </button>
    </td>
</tr>

<tr>
    <td>3</td>
    <td>2♥</td>
    <td>-50</td>

    <td>
        <button onclick="showBBO()">
            Bord Detay
        </button>
    </td>
</tr>

</tbody>

</table>



<!-- ================================================= -->
<!-- MODAL -->
<!-- ================================================= -->

<div id="bboModal" class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                Bord Detayı
            </div>

            <button
                class="close-button"
                onclick="closeBBO()">
                X
            </button>

        </div>


        <div class="bbo-container">

            <iframe
                id="bboViewer"
                src=""
                allowfullscreen>
            </iframe>

        </div>

    </div>

</div>



<script>

function showBBO() {

    const bboURL =
"https://www.bridgebase.com/tools/handviewer.html?v3b=web&v3v=6.61.5&lin=pn%7C%2C%2C%2C%7Cst%7C%7Cmd%7C1SQ9752HKDKT732CAQ%2CS84HJ9842DQ85C873%2CSK63HAT653D94CK96%2CSAJTHQ7DAJ6CJT542%7Csv%7Co%7Crh%7C%7Cah%7CBoard+0%7Cmb%7C1S%7Cmb%7CP%7Cmb%7C2S%7Cmb%7CP%7Cmb%7CP%7Cmb%7Cpc%7CS4%7C";

    document.getElementById("bboViewer").src = bboURL;

    document.getElementById("bboModal").style.display = "block";
}


function closeBBO() {

    document.getElementById("bboModal").style.display = "none";

    /*
       BBO'yu kapatırken iframe'i temizliyoruz.
       Böylece sonraki bord açıldığında
       el baştan yüklenir.
    */

    document.getElementById("bboViewer").src = "";
}

</script>

</body>
</html>
